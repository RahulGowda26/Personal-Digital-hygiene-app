<!DOCTYPE html>
<html>
<head>
  <title>Blocked by Sentinel</title>
  <style>
    body { margin: 0; padding: 0; font-family: system-ui, sans-serif; background: rgba(15,23,42,1); color: #fff; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .card { background: #fff; border-radius: 24px; padding: 40px; max-width: 500px; text-align: center; color: #0f172a; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    .icon-box { width: 64px; height: 64px; background: #ef4444; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
    .risk-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; text-align: left; margin-bottom: 24px; }
    .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 12px; transition: 0.2s; }
    .btn-primary { background: #0f172a; color: #fff; }
    .btn-primary:hover { background: #1e293b; }
    .btn-secondary { background: transparent; color: #94a3b8; }
    .btn-secondary:hover { color: #64748b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path>
        <path d="M12 9v4"></path><path d="M12 17h.01"></path>
      </svg>
    </div>
    <h2 style="font-size:24px;font-weight:bold;margin-bottom:12px;color:#0f172a;">Suspicious Link Detected</h2>
    <p style="color:#64748b;margin-bottom:24px;font-size:16px;">Sentinel has blocked <strong id="blocked-url" style="word-break: break-all;">this page</strong> because it exhibits malicious characteristics commonly used in phishing attacks.</p>
    
    <div class="risk-box">
      <h4 style="font-size:12px;color:#94a3b8;margin:0 0 12px;font-weight:bold;letter-spacing:1px;">RISK FACTORS</h4>
      <ul id="risk-factors" style="margin:0;padding-left:20px;color:#334155;font-size:14px;line-height:1.5;">
        <!-- Injected via JS -->
      </ul>
    </div>
    
    <button id="sent-btn-back" class="btn btn-primary">Go Back to Safety</button>
  </div>
  
  <script src="blocked.js"></script>
</body>
</html>
